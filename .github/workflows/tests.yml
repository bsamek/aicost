name: Swift tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      release_version:
        description: Numeric version or v-prefixed version tag used for the validated ZIP
        type: string
        default: '0.0.0'
      release_build:
        description: Bundle build number
        type: string
        default: '0'

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Check formatting and run all Swift Testing tests
        run: scripts/check.sh
      - name: Test signed update feeds with synthetic fixtures
        run: python3 -B -m unittest discover -s Tests/ReleaseTests -v

  package:
    name: Apple Silicon app and ZIP validation
    needs: test
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      SWIFT_TOOL: swift
      RELEASE_VERSION: ${{ inputs.release_version || '0.0.0' }}
      RELEASE_BUILD: ${{ inputs.release_build || '0' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, package and verify Apple Silicon app
        run: scripts/package-release.sh "$RELEASE_VERSION" "$RELEASE_BUILD"
      - name: Include pinned Sparkle signing tool for release publication
        run: cp .build/app-arm64/artifacts/sparkle/Sparkle/bin/sign_update build/release/sign_update
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: build/release/
          if-no-files-found: error
          retention-days: 7
